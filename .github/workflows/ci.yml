name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck -x tm2gdrive install.sh test/*.sh

  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests with the system /bin/bash
        run: /bin/bash test/unit-tests.sh

  integration:
    name: End-to-end on a real Mac
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install rclone
        run: brew install rclone
      - name: Set up, back up, crash, restore
        run: /bin/bash test/integration-macos.sh
